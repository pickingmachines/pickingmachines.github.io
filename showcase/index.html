  Public media rule: top gripper camera and wide shots only; no jaw-mechanism close-ups.
-->

<style>
  /* Deck palette and faces (Blueprint deck v5). The page is dark by design in both color schemes,
     like the deck's cover and cut-wall slides. */
  :root {
    --night: #1c241f;
    --shade: #0c100d;
    --cream: #f5f2ea;
    --cream-2: rgba(245, 242, 234, 0.86);
    --muted: #8d978f;
    --rule: #3e4a43;
    --sage: #8fbf9d;
    --tan: #d9a070;
    --sans: 'Source Sans 3', 'Source Sans Pro', 'Helvetica Neue', Arial, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
    --gutter: max(20px, min(5.8vw, 112px), env(safe-area-inset-left, 0px));
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--night); color: var(--cream);
    font-family: var(--sans); font-size: 1.125rem; line-height: 1.4; -webkit-font-smoothing: antialiased;
  }
  img, video { max-width: 100%; display: block; }
  p, h1, h2 { margin: 0; }
  :focus-visible { outline: 2px solid var(--tan); outline-offset: 3px; }
  .wrap { max-width: 1440px; margin: 0 auto; padding-left: var(--gutter); padding-right: var(--gutter); }

  /* Cover */
  .cover {
    position: relative; isolation: isolate; overflow: hidden;
    min-height: clamp(560px, 92svh, 940px); display: flex; background: var(--shade);
  }
  .cover-photo, .cover-photo img { position: absolute; inset: 0; width: 100%; height: 100%; }
  .cover-photo img { object-fit: cover; object-position: 30% 40%; }
  .cover-shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(90deg, rgba(12,16,13,0.45) 0%, rgba(12,16,13,0.15) 40%, rgba(12,16,13,0) 62%),
      linear-gradient(180deg, rgba(12,16,13,0.55) 0%, rgba(12,16,13,0) 26%, rgba(12,16,13,0.10) 48%, rgba(12,16,13,0.86) 86%, var(--night) 100%);
  }
  .cover-inner {
    position: relative; width: 100%;
    display: flex; flex-direction: column; justify-content: space-between; gap: 48px;
    padding-top: max(28px, min(3.75vw, 72px), env(safe-area-inset-top, 0px)); padding-bottom: clamp(40px, 6vw, 88px);
  }
  .logo { display: block; width: clamp(150px, 18.75vw, 330px); }
  .logo img { width: 100%; height: auto; }
  .cover-copy { display: flex; flex-direction: column; gap: clamp(14px, 1.6vw, 22px); max-width: 900px; }
  .kicker { font-family: var(--mono); font-size: clamp(0.85rem, 1.25vw, 1.15rem); letter-spacing: 0.04em; color: var(--tan); }
  h1 { font-size: clamp(2.5rem, 4.6vw, 5.5rem); font-weight: 700; line-height: 0.98; letter-spacing: -0.017em; text-wrap: balance; }
  .lede { font-size: clamp(1.125rem, 1.75vw, 1.6rem); font-weight: 500; line-height: 1.35; color: var(--cream-2); max-width: 36ch; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; min-height: 46px; padding: 10px 20px; border-radius: 2px;
    font-size: 1.05rem; font-weight: 600; text-decoration: none; border: 1px solid transparent;
  }
  .btn--solid { background: var(--cream); color: var(--night); }
  .btn--line { border-color: rgba(245,242,234,0.6); color: var(--cream); }
  .btn--solid:hover { background: #ffffff; }
  .btn--line:hover { border-color: var(--cream); }
  @media (max-width: 700px) {
    /* On phones the photo sits above the text so the headline never lands on the white canopy. */
    .cover { min-height: 0; }
    .cover-photo, .cover-photo img { bottom: auto; height: 66vw; }
    .cover-photo img { object-position: 50% 50%; }
    .cover-shade { background: linear-gradient(180deg, rgba(12,16,13,0.55) 0, rgba(12,16,13,0) 22vw, rgba(12,16,13,0.15) 44vw, var(--night) 66vw, var(--night) 100%); }
    .cover-inner { justify-content: flex-start; gap: 0; }
    .cover-copy { margin-top: calc(66vw - 110px); }
  }

  /* Cut wall, as on the deck slide */
  .wall { padding-top: clamp(48px, 7vw, 104px); padding-bottom: clamp(40px, 6vw, 88px); }
  .wall-head { display: flex; flex-direction: column; gap: 22px; margin-bottom: clamp(24px, 3vw, 40px); }
  .wall-head::before { content: ""; width: 42px; height: 3px; background: var(--sage); }
  h2 { font-size: clamp(2rem, 3.25vw, 3.9rem); font-weight: 700; line-height: 1.04; letter-spacing: -0.018em; }
  .frame { position: relative; aspect-ratio: 16 / 9; background: #000000; border: 1px solid var(--rule); border-radius: 2px; overflow: hidden; }
  .frame video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .wall-toggle {
    position: absolute; right: 12px; bottom: 12px; min-height: 36px; padding: 6px 12px;
    font-family: var(--mono); font-size: 0.8rem; color: var(--cream);
    background: rgba(12,16,13,0.72); border: 1px solid rgba(245,242,234,0.45); border-radius: 2px; cursor: pointer;
  }

  footer { padding-bottom: max(28px, env(safe-area-inset-bottom, 0px)); }
  .foot {
    display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px 24px;
    padding-top: 22px; border-top: 1px solid var(--rule);
    font-family: var(--mono); font-size: 0.85rem; letter-spacing: 0.02em; color: var(--muted);
  }
  .foot a { color: var(--muted); text-underline-offset: 3px; }
  .foot a:hover { color: var(--cream); }
</style>

<body>

<header class="cover">
  <picture class="cover-photo">
    <source media="(max-width: 700px)" srcset="media/hero-900.jpg">
    <img src="media/hero-1600.jpg" alt="The Picking Machines robot straddling a strawberry bed, seen from a drone" fetchpriority="high">
  </picture>
  <div class="cover-shade"></div>
  <div class="wrap cover-inner">
    <a class="logo" href="/"><img src="media/wordmark.png" alt="Picking Machines" width="720" height="216"></a>
    <div class="cover-copy">
      <p class="kicker">Blueprint Showcase · Fall 2026</p>
      <h1>We teach robots farm work.<br> First job: strawberry runners.</h1>
      <p class="lede">Physical AI for specialty agriculture, developed on a commercial strawberry farm in Watsonville, California.</p>
      <div class="actions">
        <a class="btn btn--solid" href="mailto:sam@pickingmachines.com?subject=Blueprint%20Showcase" data-track="email">Email Sam</a>
        <a class="btn btn--line" href="https://www.linkedin.com/in/robosam" target="_blank" rel="noopener" data-track="linkedin">LinkedIn</a>
      </div>
    </div>
  </div>
</header>

<main class="wrap wall">
  <div class="wall-head">
    <h2>One cut, then thousands.</h2>
  </div>
  <div class="frame">
    <video id="wall" muted loop playsinline preload="none" poster="media/cut-wall.jpg" aria-label="Runner cuts from the robot's gripper camera, starting with one and multiplying into thousands">
      <source src="media/cut-wall.mp4" type="video/mp4">
    </video>
    <button class="wall-toggle" id="wall-toggle" type="button" aria-pressed="false">Play</button>
  </div>
</main>

<footer class="wrap">
  <div class="foot">
    <span>© 2026 Picking Machines</span>
    <a href="/">pickingmachines.com</a>
  </div>
</footer>

<script>
(function () {
  document.querySelectorAll('[data-track]').forEach(function (el) {
    el.addEventListener('click', function () {
      try { if (typeof window.gtag === 'function') window.gtag('event', 'showcase_click', { target: el.dataset.track }); } catch (e) {}
    });
  });

  /* Cut wall: plays muted while on screen; respects reduced motion; always pausable. */
  var wall = document.getElementById('wall');
  var toggle = document.getElementById('wall-toggle');
  var held = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function label() {
    toggle.textContent = wall.paused ? 'Play' : 'Pause';
    toggle.setAttribute('aria-pressed', String(!wall.paused));
  }
  toggle.addEventListener('click', function () {
    if (wall.paused) { held = false; wall.play().catch(function () {}); }
    else { held = true; wall.pause(); }
  });
  wall.addEventListener('play', label);
  wall.addEventListener('pause', label);
  if ('IntersectionObserver' in window) {
    new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting && !held) wall.play().catch(function () {});
        else if (!e.isIntersecting && !wall.paused) wall.pause();
      });
    }, { threshold: 0.35 }).observe(wall);
  }
  label();
})();
</script>
</body>
